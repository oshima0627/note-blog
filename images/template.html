<!doctype html>
<meta charset="utf-8">
<!--
  note 見出し画像テンプレート (1280x670)

  render.mjs が以下のプレースホルダを置換して Playwright でスクリーンショットを撮る。
    __TITLE__     記事タイトル
    __BADGE__     カテゴリバッジの文字 (無料 / 有料 など)
    __ACCENT__    アクセント色
    __AUTHOR__    著者表示名

  文字サイズは fitTitle() が実測して自動で縮める。テンプレートを直すときは
  npm run render -- --all で全記事を再生成し、見切れが出ないか確認すること。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1280px; height: 670px; }

  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 64px;
    background: #0f1420;
    background-image:
      radial-gradient(ellipse 900px 600px at 82% 8%, rgba(224, 122, 95, .22), transparent 60%),
      radial-gradient(ellipse 700px 500px at 8% 96%, rgba(90, 120, 190, .18), transparent 62%);
    font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
    color: #f2f4f8;
    position: relative;
    overflow: hidden;
  }

  /* 背景の薄いグリッド。情報量を足さずに「開発者向け」の質感を出す */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }

  /* 左端のアクセントバー */
  body::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 10px;
    height: 100%;
    background: var(--accent);
  }

  header, main, footer { position: relative; z-index: 1; }

  .badge {
    display: inline-block;
    padding: 9px 20px;
    border: 2px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: .1em;
  }

  main { display: flex; align-items: center; flex: 1; padding: 28px 0; }

  h1 {
    font-size: 78px;           /* fitTitle() が縮める上限値 */
    font-weight: 700;
    line-height: 1.34;
    letter-spacing: .005em;
    /* 日本語の禁則処理。行頭に句読点が来るのを防ぐ */
    word-break: normal;
    overflow-wrap: anywhere;
    line-break: strict;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255, 255, 255, .13);
    padding-top: 26px;
  }

  .author { font-size: 29px; font-weight: 700; color: #d5dae6; }

  .dots { display: flex; gap: 9px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); opacity: .85; }
  .dots i:nth-child(2) { opacity: .5; }
  .dots i:nth-child(3) { opacity: .25; }
</style>

<body style="--accent: __ACCENT__">
  <header><span class="badge">__BADGE__</span></header>
  <main><h1 id="title">__TITLE__</h1></main>
  <footer>
    <span class="author">__AUTHOR__</span>
    <span class="dots"><i></i><i></i><i></i></span>
  </footer>
</body>

<script>
  /**
   * タイトルが main の高さに収まるまでフォントサイズを 2px ずつ下げる。
   * 長いタイトルでも見切れず、短いタイトルは大きいまま保たれる。
   * render.mjs は window.__fitted が true になるのを待ってから撮影する。
   */
  function fitTitle() {
    const h1 = document.getElementById("title");
    const box = document.querySelector("main");
    const min = 40;
    let size = 78;

    h1.style.fontSize = size + "px";
    while (h1.scrollHeight > box.clientHeight && size > min) {
      size -= 2;
      h1.style.fontSize = size + "px";
    }
    window.__fitted = true;
  }

  document.fonts.ready.then(fitTitle);
</script>
