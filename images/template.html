<!doctype html>
<meta charset="utf-8">
<!--
  note 見出し画像テンプレート (1280x670)

  設計の根拠: 2026-08-13 に note の「Claude Code」人気記事20本の見出し画像を
  取得して分析した結果、伸びている記事は例外なく「文字が主役」だった。
    - タイトル文字が枠のほぼ全面を占める(余白で見せるデザインではない)
    - 数字や要点の一語だけをアクセント色で強調する
    - 明るい背景 + 黒文字が11/20。暗い背景は AI イラスト系がほとんどで、
      文字主体のデザインでは明るい背景が主流
  この3点を満たす形に作り替えたテンプレート。

  render.mjs が置換するプレースホルダ:
    TITLE_HTML   タイトル(塊ごとに span、強調は <b>)
    BADGE_TEXT   【無料】【有料】
    ACCENT_COLOR アクセント色
    AUTHOR_NAME  著者表示名
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1280px; height: 670px; }

  body {
    background: #fdfaf4;
    font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
    color: #14161a;
    padding: 26px;
  }

  /* 内側の細い枠。人気記事に共通して見られた囲み */
  .frame {
    width: 100%;
    height: 100%;
    border: 3px solid #14161a;
    display: flex;
    flex-direction: column;
    padding: 40px 54px 34px;
  }

  .badge {
    font-size: 30px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .04em;
    margin-bottom: 10px;
  }

  /*
    min-height: 0 が要る。flex アイテムの既定 min-height: auto のままだと
    中身に合わせて伸び、フッターを枠外へ押し出してしまう。
  */
  main {
    display: flex;
    align-items: center;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  h1 {
    font-size: 92px;          /* fitTitle() が縮める上限値 */
    font-weight: 700;
    line-height: 1.28;
    letter-spacing: -.01em;
    line-break: strict;       /* 行頭に句読点が来るのを防ぐ */
  }

  /*
    render.mjs が句読点・助詞で切った塊を span で包んでいる。
    塊の内部では改行させないので、改行は必ず意味の切れ目で起きる。
  */
  h1 span { white-space: nowrap; }

  /* 数字や要点の一語。ここだけ色を変えて視線を止める */
  h1 b { color: var(--accent); font-weight: 700; }

  footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    padding-top: 18px;
  }

  .author { font-size: 27px; font-weight: 700; color: #5b6270; }
  .mark { width: 15px; height: 15px; background: var(--accent); border-radius: 50%; }
</style>

<body style="--accent: ACCENT_COLOR">
  <div class="frame">
    <div class="badge">BADGE_TEXT</div>
    <main><h1 id="title">TITLE_HTML</h1></main>
    <footer>
      <span class="author">AUTHOR_NAME</span>
      <span class="mark"></span>
    </footer>
  </div>
</body>

<script>
  /**
   * タイトルが main に収まるまでフォントサイズを 2px ずつ下げる。
   *
   * 高さだけでなく幅も見る。塊を改行禁止にしているため、長い塊が
   * 1行に収まらないと横にはみ出す(高さは超えない)ことがあるため。
   * render.mjs は window.__fitted が true になるのを待ってから撮影する。
   */
  function fitTitle() {
    const h1 = document.getElementById("title");
    const box = document.querySelector("main");
    const min = 34;
    let size = 92;

    const overflows = () => h1.scrollHeight > box.clientHeight || h1.scrollWidth > box.clientWidth;

    h1.style.fontSize = size + "px";
    while (overflows() && size > min) {
      size -= 2;
      h1.style.fontSize = size + "px";
    }
    // render.mjs 側で「縮みすぎ」と「収まりきらなかった」を検知するために残す
    window.__fittedSize = size;
    window.__overflowed = overflows();
    window.__fitted = true;
  }

  document.fonts.ready.then(fitTitle);
</script>
